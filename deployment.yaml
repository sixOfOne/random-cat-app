apiVersion: apps/v1
kind: Deployment
metadata:
  name: random-cat-deployment
spec:
  replicas: 1  # Keep it light
  selector:
    matchLabels:
      app: random-cat
  template:
    metadata:
      labels:
        app: random-cat
    spec:
      containers:
      - name: random-cat
        image: random-cat-app:latest
        imagePullPolicy: Never  # Use local image
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: random-cat-service
spec:
  type: NodePort
  selector:
    app: random-cat
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30000
